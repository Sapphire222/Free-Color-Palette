<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>调色盘 · 专属配色方案</title>
<style>html,body{margin:0;padding:0;background:#0e1118;}</style>
</head>
<body>
<!-- ============================================================
     调色盘 · Palette Widget  (fragment，无 html/head/body)
     由 color-palette skill 使用。每次调用只替换 __PALETTE_DATA__ 与 __PALETTE_LIBRARY__
     ============================================================ -->
<div id="cpApp">
<style>
#cpApp{--bg:#0e1118;--card:#161a23;--card2:#1d2230;--line:#2a3143;--tx:#e7ecf7;--dim:#8b94aa;--acc:#7aa2ff;
  --hover:rgba(255,255,255,.06);--ring:rgba(255,255,255,.11);--onacc:#0b0e14;--gold:#ffcf5c;
  --soft:rgba(255,255,255,.065);--pill:rgba(255,255,255,.16);
  --accbg:rgba(122,162,255,.16);--danger:#ff6b6b;--dangerbg:rgba(255,107,107,.15);
  --glass:rgba(19,23,32,.72);--glass2:rgba(255,255,255,.055);--glassline:rgba(255,255,255,.1);
  --ok:#6ECF8F;--okbg:rgba(110,207,143,.18);--headsh:rgba(2,6,14,.5);--veil:rgba(122,162,255,.11);--veil2:rgba(122,162,255,.05);
  font-family:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong","SimSun",serif;
  background:transparent;color:var(--tx);padding:22px 30px;width:100%;margin:0 auto;box-sizing:border-box;
  position:relative;overflow:hidden;overflow:clip;line-height:1.6;font-size:13.5px;}
/* 页面底色统一由 body 出（与组件同步过渡），组件自身不再是“一块有底色的板”，切换主题时看不到框 */
body{margin:0;background:#0E1118;transition:background .34s ease;}
#cpApp.th-light{--bg:#F7F3E8;--card:#FFFDF6;--card2:#F1EBDD;--line:#E2D8C4;--tx:#2C261E;--dim:#8B8272;--acc:#C08636;
  --hover:rgba(0,0,0,.05);--ring:rgba(0,0,0,.10);--onacc:#FFFDF6;--gold:#C08F26;
  --soft:rgba(0,0,0,.05);--pill:#FFFDF6;
  --accbg:rgba(192,134,54,.15);--danger:#D34A3E;--dangerbg:rgba(211,74,62,.13);
  --glass:rgba(255,253,247,.7);--glass2:rgba(0,0,0,.035);--glassline:rgba(0,0,0,.08);
  --ok:#2F9E5F;--okbg:rgba(47,158,95,.15);--headsh:rgba(70,58,36,.16);--veil:rgba(192,134,54,.10);--veil2:rgba(192,134,54,.045);}
/* 极简无框（日间 / 夜间统一）：取消一切阴影与描边，只靠色块与留白分层 */
#cpApp .cp-group,
#cpApp .cp-ind,
#cpApp .cp-th-ind,
#cpApp .cp-chip,
#cpApp .cp-libsw,
#cpApp .cp-toast,
#cpApp .cp-drawer,
#cpApp .cp-libitem{box-shadow:none;}
#cpApp .cp-group{background:transparent;border-color:transparent;}
#cpApp .cp-seg,
#cpApp .cp-libbtn,
#cpApp .cp-gradbar{border-color:transparent;background:transparent;}
#cpApp .cp-copy{border-color:transparent;background:var(--soft);}
/* 悬停反馈必须实打实看得见：底色 + 文字一起变（光变边框在无框模式下等于没反馈） */
#cpApp .cp-copy:hover,
#cpApp .cp-libbtn:hover,
#cpApp .cp-dfoot button:hover{background:var(--accbg);color:var(--acc);}
#cpApp .cp-copy:active,
#cpApp .cp-libbtn:active,
#cpApp .cp-dfoot button:active{transform:translateY(1px);}
#cpApp .cp-dot{box-shadow:0 0 0 2px var(--ring);}
#cpApp .cp-libitem{background:var(--glass2);border-color:transparent;}
#cpApp .cp-drawer{border-left-color:var(--glassline);}
#cpApp *{box-sizing:border-box;}
#cpApp h3{margin:0;font-size:14px;font-weight:700;}
/* 基础重置：用 :where() 把优先级降到 0，否则 #cpApp 这个 id 会压死下面所有 .cp-xxx button 规则
   （曾导致按钮背景/内边距/悬停变色全部失效） */
:where(#cpApp) button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0;}
:where(#cpApp) button:disabled{cursor:default;}
/* 顶部区（标题/标语/搜索框）：不再吸顶——下滑时整体划走，只留格式框钉在最上面 */
.cp-head{position:relative;z-index:15;background:var(--bg);
  margin:-22px -30px 0;padding:22px 30px 0;
  transition:background .34s ease;}
.cp-hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.cp-title{font-size:24px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:9px;flex:0 0 auto;}
.cp-emoji{font-size:18px;line-height:1;font-weight:400;
  font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;}
.cp-hact{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto;}
.cp-sub{font-size:12.5px;color:var(--dim);margin-top:6px;transition:opacity .26s ease;}
.cp-sub.fade{opacity:0;}

/* ---------- 联想搜索：输入框 + 磨砂玻璃提示面板（分区标签流） ---------- */
.cp-sbox{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 14px;border-radius:12px;
  background:var(--soft);transition:background .24s;cursor:text;}
.cp-sbox:focus-within{background:var(--accbg);}
.cp-sbox svg{width:14px;height:14px;color:var(--dim);flex:0 0 auto;}
.cp-sbox input{flex:1 1 auto;min-width:0;border:0;background:none;outline:none;font-family:inherit;
  font-size:13px;color:var(--tx);}
.cp-sbox input::placeholder{color:var(--dim);}
.cp-panel{display:none;background:var(--glass);border-radius:16px;padding:16px 18px;margin:4px 0 14px;
  -webkit-backdrop-filter:blur(26px) saturate(1.45);backdrop-filter:blur(26px) saturate(1.45);
  animation:cpPanelIn .28s ease;}
@keyframes cpPanelIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
#cpApp.searching .cp-panel{display:block;}
#cpApp.searching #cpGroups{display:none;}
.cp-phead{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.cp-phead span{font-size:12px;color:var(--dim);flex:1 1 auto;}
.cp-phead button{font-size:11.5px;color:var(--dim);padding:3px 10px;border-radius:8px;white-space:nowrap;
  transition:background .22s,color .22s;}
.cp-phead button:hover{background:var(--accbg);color:var(--acc);}
/* 分类小节：标题 + 一条横向分隔线；标签强制不换行，由内容撑宽 */
.cp-cat{margin-bottom:14px;}
.cp-cat:last-child{margin-bottom:2px;}
.cp-cat-h{display:flex;align-items:center;gap:12px;margin-bottom:9px;}
.cp-cat-h span{font-size:11.5px;color:var(--dim);letter-spacing:1px;white-space:nowrap;}
.cp-cat-h::after{content:'';flex:1;height:1px;background:var(--glassline);}
.cp-tags{display:flex;flex-wrap:wrap;gap:8px;}
.cp-tag{white-space:nowrap;font-family:inherit;font-size:12.5px;padding:6px 14px;border-radius:999px;
  background:var(--glass2);color:var(--tx);transition:background .22s,color .22s,transform .18s;}
.cp-tag:hover{background:var(--accbg);color:var(--acc);}
.cp-tag:active{transform:translateY(1px);}
.cp-miss{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;
  background:var(--glass2);border-radius:10px;padding:8px 12px;margin-bottom:12px;}
.cp-miss button{font-family:inherit;font-size:11.5px;color:var(--acc);padding:3px 10px;border-radius:8px;
  background:var(--accbg);white-space:nowrap;}
.cp-miss button:hover{filter:brightness(1.1);}
/* 联想模式下显示在组上方的退出条 */
.cp-sbar{display:flex;align-items:center;gap:12px;margin:2px 0 12px;font-size:12px;color:var(--acc);}
.cp-sbar button{font-family:inherit;font-size:11.5px;color:var(--dim);padding:2px 8px;border-radius:8px;
  white-space:nowrap;transition:background .2s,color .2s;}
.cp-sbar button:hover{background:var(--accbg);color:var(--acc);}
/* 联想模式渐隐模块：从退出条开始向下渐隐，盖到内容底部，给「特殊模式」的包裹感 */
#cpGroups.asm{background:linear-gradient(180deg,var(--veil) 0%,var(--veil2) 46%,rgba(0,0,0,0) 100%);
  border-radius:16px;margin:-4px -12px -10px;padding:4px 12px 10px;
  transition:background .34s ease;}
.cp-ver{font-size:10.5px;color:var(--dim);flex:0 0 auto;opacity:.85;letter-spacing:.4px;margin-left:8px;
  font-weight:400;}

/* ---------- 取色面板：页面内自绘（长方形取色区 + 色相条），撤销/重做住在面板最下方 ---------- */
.cp-ovl{position:absolute;inset:0;z-index:35;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,16,.42);}
.cp-ovl.on{display:flex;}
.cp-pk{width:300px;max-width:92%;background:var(--glass);border-radius:16px;padding:14px;
  -webkit-backdrop-filter:blur(26px) saturate(1.45);backdrop-filter:blur(26px) saturate(1.45);}
.cp-sv{position:relative;height:168px;border-radius:10px;cursor:crosshair;touch-action:none;}
.cp-sv .w{position:absolute;inset:0;border-radius:10px;background:linear-gradient(90deg,#FFFFFF,rgba(255,255,255,0));}
.cp-sv .b{position:absolute;inset:0;border-radius:10px;background:linear-gradient(0deg,#000000,rgba(0,0,0,0));}
.cp-svdot,.cp-huedot{position:absolute;border-radius:50%;border:2px solid #FFFFFF;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.3);pointer-events:none;transform:translate(-50%,-50%);}
.cp-svdot{width:14px;height:14px;}
.cp-hue{position:relative;height:12px;border-radius:6px;margin-top:12px;cursor:pointer;touch-action:none;
  background:linear-gradient(90deg,#FF0000,#FFFF00,#00FF00,#00FFFF,#0000FF,#FF00FF,#FF0000);}
.cp-huedot{width:16px;height:16px;top:50%;}
.cp-pkrow{display:flex;align-items:center;gap:10px;margin-top:12px;}
.cp-pkprev{width:36px;height:36px;border-radius:10px;flex:0 0 auto;}
.cp-pkhex{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.3px;flex:1 1 auto;}
.cp-pkdrop{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--dim);font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:background .22s,color .22s;}
.cp-pkdrop:hover{background:var(--accbg);color:var(--acc);}
.cp-pkfoot{display:flex;align-items:center;gap:2px;margin-top:12px;padding-top:10px;border-top:1px solid var(--glassline);}
.cp-pkfoot button{width:30px;height:30px;border-radius:9px;font-size:15px;line-height:1;color:var(--dim);
  transition:background .22s,color .22s,opacity .22s;}
.cp-pkfoot button:hover:not(:disabled){background:var(--accbg);color:var(--acc);}
.cp-pkfoot button:disabled{opacity:.26;}
.cp-pkdone{margin-left:auto;width:auto !important;height:auto !important;font-size:12.5px;padding:7px 15px;
  border-radius:9px;background:var(--acc);color:var(--onacc);font-weight:700;
  transition:filter .2s,transform .18s;}
.cp-pkdone:hover{filter:brightness(1.08);}
.cp-pkdone:active{transform:translateY(1px);}

/* 悬停色块：出现「复制该颜色编码」提示（跟随鼠标，不固定在色块角上） */
.cp-tip{position:absolute;z-index:31;background:rgba(0,0,0,.55);color:#FFFFFF;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  font-size:10.5px;padding:3px 8px;border-radius:7px;opacity:0;transition:opacity .18s ease;
  pointer-events:none;white-space:nowrap;transform:translate(0,2px);}
.cp-tip.on{opacity:1;transform:translate(0,0);}

/* 组头圆点容器：对比色两颗 / 其余一颗（取中间色） */
.cp-dotwrap{display:flex;align-items:center;gap:4px;flex:0 0 auto;}

.cp-libbtn{display:inline-flex;align-items:center;gap:7px;font-size:14px;padding:6px 12px;border-radius:10px;margin-right:12px;
  border:1px solid var(--line);background:var(--card2);transition:.2s;flex:0 0 auto;}
.cp-libbtn:hover{border-color:var(--acc);color:var(--acc);}
.cp-libico{width:14px;height:14px;display:block;flex:0 0 auto;}
.cp-libbtn b{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;background:var(--acc);
  color:var(--onacc);border-radius:8px;font-size:10.5px;margin-left:5px;padding:0 4px;font-weight:700;
  transition:background .34s,color .34s;}

/* 日间 / 夜间 开关：完全无框——没有底色块、没有滑块，只有文字深浅 + 一条滑动下划线 */
.cp-theme{position:relative;display:flex;align-items:center;gap:16px;padding:3px 0;flex:0 0 auto;}
.cp-th-ind{position:absolute;left:0;bottom:0;height:2px;border-radius:2px;background:var(--acc);
  transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1),background .34s;}
.cp-theme button{position:relative;z-index:1;font-family:inherit;font-size:12.5px;padding:2px 0;
  color:var(--dim);letter-spacing:.6px;white-space:nowrap;transition:color .24s;}
.cp-theme button:hover{color:var(--tx);}
.cp-theme button.on{color:var(--tx);font-weight:700;}

/* 格式框吸顶：全屏宽的吸顶条（比顶部区更高一层），滚动到位后钉住，
   下方同样是一条向下盖的 10px 渐隐阴影；搜索面板打开时整条隐藏 */
.cp-seg{position:sticky;top:0;z-index:16;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  border-radius:0;padding:6px 30px;margin:12px -30px 12px;
  transition:background .34s;}
/* 吸顶时必须是不透明底色（跟随主题），否则内容会从条后面透出来；
   用 #cpApp 前缀压过上面那条无框重置的 transparent */
#cpApp .cp-seg{background:var(--bg);}
.cp-seg::after{content:'';position:absolute;top:100%;left:0;right:0;height:10px;pointer-events:none;
  background:linear-gradient(to bottom,var(--headsh),rgba(0,0,0,0));opacity:0;transition:opacity .3s ease;}
.cp-seg.float::after{opacity:1;}
#cpApp.searching .cp-seg{display:none;}
.cp-ind{position:absolute;top:6px;left:0;height:calc(100% - 12px);border-radius:8px;background:var(--acc);
  transition:transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1),background .34s;}
.cp-seg button{position:relative;z-index:1;font-family:inherit;font-size:12.5px;padding:5px 0;border-radius:8px;
  color:var(--dim);transition:color .22s;letter-spacing:.4px;}
.cp-seg button:hover{color:var(--tx);}
.cp-seg button:active{transform:translateY(1px);}
.cp-seg button.on{color:var(--onacc);font-weight:700;}

.cp-group{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
  transition:background .34s,border-color .34s;}
.cp-ghead{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.cp-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px var(--ring);}
.cp-gname{font-size:12.5px;color:var(--dim);border-left:1px solid var(--line);padding-left:9px;
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-gnum{font-size:11px;color:var(--dim);opacity:.7;font-variant-numeric:tabular-nums;flex:0 0 auto;}
.cp-gact{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto;}

/* 星星：默认窄，悬停缓慢横向延展为「入库」长方形 */
.cp-star{display:inline-flex;align-items:center;height:30px;width:32px;padding-left:9px;border-radius:9px;
  font-size:15px;line-height:1;color:var(--dim);border:1px solid transparent;overflow:hidden;white-space:nowrap;
  flex:0 0 auto;
  transition:width .58s cubic-bezier(.32,1.04,.42,1),background .4s,border-color .4s,color .4s;}
.cp-star .ic{display:inline-block;flex:0 0 auto;transition:transform .62s cubic-bezier(.34,1.5,.64,1);}
.cp-star .lb{font-size:12.5px;max-width:0;opacity:0;margin-left:0;flex:0 0 auto;
  transition:max-width .56s cubic-bezier(.32,1.04,.42,1),opacity .38s .12s,margin-left .56s cubic-bezier(.32,1.04,.42,1);}
.cp-star:hover{width:84px;background:rgba(255,207,92,.13);border-color:rgba(255,207,92,.4);color:var(--gold);}
.cp-star:hover .ic{transform:scale(1.18) rotate(-16deg);}
.cp-star:hover .lb{max-width:54px;opacity:1;margin-left:6px;}
.cp-star.on{color:var(--gold);}
.cp-star.on:hover{background:rgba(255,207,92,.16);border-color:rgba(255,207,92,.5);}
.cp-star.pop .ic{animation:cpPop .78s cubic-bezier(.34,1.4,.5,1);}
@keyframes cpPop{
  0%{transform:scale(1);}
  38%{transform:scale(1.42) rotate(16deg);}
  68%{transform:scale(.94) rotate(-6deg);}
  100%{transform:scale(1);}
}

.cp-copy{font-size:12.5px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);
  transition:.2s;flex:0 0 auto;}
.cp-copy:hover{border-color:var(--acc);color:var(--acc);}
.cp-note{font-size:12.5px;color:var(--dim);margin:0 0 11px;padding-left:19px;}
.cp-gradbar{height:10px;border-radius:6px;margin-bottom:10px;overflow:hidden;}

.cp-sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.cp-sws.seven{grid-template-columns:repeat(7,1fr);gap:7px;}
/* 对比色：每套只有两个颜色，各占一半 */
.cp-sws.two{grid-template-columns:repeat(2,1fr);}
.cp-sws.two .cp-sw{height:88px;}
.cp-sws.two .cp-code{font-size:14px;}
.cp-sw{position:relative;height:88px;border-radius:12px;overflow:hidden;cursor:pointer;}
.cp-sw:active{transform:translateY(1px);}
.cp-chip{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;
  border-radius:12px;}
.cp-code{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cp-code2{font-size:10.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.cp-tool{position:absolute;top:5px;width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.36);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;opacity:0;
  transition:opacity .3s ease,background .2s;z-index:2;backdrop-filter:blur(4px);}
.cp-tool i{font-style:normal;}
.cp-pick{right:30px;cursor:pointer;}
.cp-drop{right:5px;}
.cp-sw:hover .cp-tool{opacity:1;}
.cp-tool:hover{background:rgba(0,0,0,.62);}

/* 组内翻页：左右箭头 + 圆点指示，六套循环；两端是这一组专属的「上一批 / 换一批」 */
.cp-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;}
.cp-pgmid{display:flex;align-items:center;justify-content:center;gap:16px;flex:1 1 auto;min-width:0;}
.cp-pg{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;padding-bottom:3px;
  transition:background .24s,color .24s,transform .26s cubic-bezier(.32,1.04,.42,1);}
.cp-pg:hover{background:var(--accbg);color:var(--acc);transform:scale(1.12);}
.cp-pg:active{transform:scale(.9);}
.cp-dots{display:flex;align-items:center;gap:7px;}
.cp-dots button{width:7px;height:7px;border-radius:4px;background:var(--dim);opacity:.32;
  transition:width .34s cubic-bezier(.32,1.04,.42,1),opacity .24s,background .24s;}
.cp-dots button:hover{opacity:.75;}
.cp-dots button.on{width:20px;background:var(--acc);opacity:1;}

/* 每组专属的批次按钮：与旧的底部按钮同一套样子 */
.cp-gbatch{font-family:inherit;font-size:12px;padding:8px 13px;border-radius:10px;background:var(--soft);
  color:var(--dim);white-space:nowrap;flex:0 0 auto;transition:background .24s,color .24s,opacity .24s;}
.cp-gbatch:hover:not(:disabled){color:var(--tx);background:var(--hover);}
.cp-gbatch:disabled{opacity:.28;cursor:default;}
.cp-gbatch.pri{color:var(--acc);font-weight:700;}
.cp-gbatch.pri:hover{background:rgba(122,162,255,.14);color:var(--acc);}
#cpApp.th-light .cp-gbatch.pri:hover{background:rgba(192,134,54,.14);}
/* 未到出现时机时占位淡隐（不占位会挤动中间那排圆点） */
.cp-gbatch.cp-hide{opacity:0;pointer-events:none;}
@media (max-width:620px){
  .cp-gbatch{font-size:11px;padding:7px 9px;}
}



/* 仓库：磨砂玻璃抽屉 */
.cp-drawer{position:absolute;top:0;right:0;bottom:0;width:352px;max-width:88%;background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(1.45);backdrop-filter:blur(26px) saturate(1.45);
  border-left:1px solid var(--glassline);
  transform:translateX(102%);transition:transform .38s cubic-bezier(.32,.72,.24,1),background .34s,border-color .34s;
  display:flex;flex-direction:column;z-index:20;}
.cp-drawer.on{transform:none;}
.cp-dhead{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;
  border-bottom:1px solid var(--glassline);font-weight:700;font-size:13.5px;letter-spacing:.5px;}
.cp-dhead button{font-size:15px;color:var(--dim);transition:color .2s,transform .3s;}
.cp-dhead button:hover{color:var(--tx);transform:rotate(90deg);}
.cp-dbody{flex:1;overflow-y:auto;padding:13px 15px;}
.cp-dempty{font-size:12px;color:var(--dim);text-align:center;padding:34px 12px;line-height:2;}
.cp-libitem{border-radius:15px;padding:12px;margin-bottom:10px;transition:background .3s;position:relative;}
.cp-libitem .nm{font-size:12.5px;font-weight:600;margin-bottom:9px;display:flex;justify-content:space-between;
  gap:6px;align-items:center;}
.cp-libitem .tp{font-size:10px;color:var(--dim);font-weight:400;background:var(--soft);border-radius:7px;
  padding:2px 7px;flex:0 0 auto;}
.cp-libsws{display:grid;gap:5px;margin-bottom:10px;}
.cp-libsw{height:60px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px 3px;
  overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.32,1.04,.42,1);}
.cp-libsw:hover{transform:translateY(-2px);}
.cp-libsw span{font-size:9.5px;line-height:1.3;font-weight:700;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;letter-spacing:.1px;}
/* 库条：复制在左、移出在右，两端分开；常态用与收藏标题一致的深色，悬停才上色 */
.cp-libact{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cp-libact button{font-size:11px;padding:6px 13px;border-radius:9px;background:var(--soft);color:var(--tx);
  transition:background .24s,color .24s,transform .18s;}
.cp-libact button:hover{background:var(--accbg);color:var(--acc);}
.cp-libact button:active{transform:translateY(1px);}
.cp-libact button.del:hover{background:var(--dangerbg);color:var(--danger);}
.cp-dfoot{border-top:1px solid var(--glassline);padding:12px 15px;font-size:10.5px;color:var(--dim);line-height:1.8;}
.cp-dfoot button{font-size:11.5px;padding:7px 12px;border-radius:8px;background:var(--soft);color:var(--tx);margin-bottom:8px;
  transition:.22s;}
.cp-dfoot button:hover{color:var(--acc);}

/* 提示条：所有提示统一固定在实际屏幕下方正中（不随页面滚动跑掉），带一个对勾，只淡入 */
.cp-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--glass);color:var(--tx);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  border-radius:11px;padding:8px 14px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:opacity .16s ease;z-index:40;max-width:86%;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
.cp-toast.on{opacity:1;}
.cp-toast .cp-ck{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
  background:var(--okbg);color:var(--ok);font-size:11px;font-weight:700;line-height:1;flex:0 0 auto;}
@media (max-width:620px){
  .cp-sws{grid-template-columns:repeat(3,1fr);}
  .cp-sws.two{grid-template-columns:repeat(2,1fr);}
  .cp-sws.seven{grid-template-columns:repeat(4,1fr);}
  .cp-sw{height:76px;}
  .cp-sws.two .cp-sw{height:76px;}
}

    histUI(); toast('已撤销 · ' + a.from);
    syncPickToSwatch();
  }
  function doRedo(){
    var a = REDO.pop(); if(!a) return;
    HIST.push(a);
    setOverride(groupOf(a.g), a.s, a.c, a.to);
    patchSwatch(a.g, a.s, a.c, a.to);
    histUI(); toast('已重做 · ' + a.to);
    syncPickToSwatch();
  }

  /* ---------- 复制配色（跟随当前编码格式） ---------- */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  var ENC_LABEL = {hex:'HEX', rgb:'RGB', hsl:'HSL', name:'色名', zh:'古名'};
  function codeFull(hex){
    var c = h2r(hex);
    if(ENC==='rgb') return 'rgb(' + c[0] + ', ' + c[1] + ', ' + c[2] + ')';
    if(ENC==='hsl'){ var h = rgb2hsl(c[0],c[1],c[2]); return 'hsl(' + h[0] + ', ' + h[1] + '%, ' + h[2] + '%)'; }
    if(ENC==='zh') return nearest(TZH, hex, 'z').n;
    if(ENC==='name') return nearest(TEN, hex, 'e').zh;
    return upHex(hex);
  }
  function paletteText(colors){
    var o = [];
    for(var i=0;i<colors.length;i++) o.push(codeFull(colors[i]));
    return o.join(', ');
  }
  function copyText(txt, okMsg){
    var done = function(){ toast(okMsg || ('已复制 · ' + txt)); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done).catch(function(){ fallback(txt, done); });
      } else fallback(txt, done);
    }catch(e){ fallback(txt, done); }
  }

  /* ---------- 渲染 ---------- */
  var elSub = document.getElementById('cpSub');
  var elGroups = document.getElementById('cpGroups');

  /* 组头圆点：对比色 = 两颗（就是当前这两个颜色）；其余 = 一颗（居中那个色） */
  function dotWrapHTML(g, cols){
    var list = (g.key === 'contrast')
      ? [upHex(cols[0]), upHex(cols[1] || cols[0])]
      : [upHex(cols[Math.floor(cols.length / 2)] || cols[0])];
    var h = '<span class="cp-dotwrap">';
    for(var i=0;i<list.length;i++) h += '<span class="cp-dot" style="background:'+list[i]+'"></span>';
    return h + '</span>';
  }

  function render(){
    var html = '';
    if(SEARCH){
      html += '<div class="cp-sbar">联想模式 · 「'+esc(SEARCH)+'」'
            + '<button data-act="exitsearch" title="回到常规的六套批次配色">✕ 退出联想</button></div>';
    }
    for(var gi=0; gi<GROUPS.length; gi++){
      var g = GROUPS[gi];
      var cs = curSet(g);
      var cols = curColors(g);
      var starred = isStarred(g);
      html += '<div class="cp-group">';
      html += '<div class="cp-ghead">';
      html += dotWrapHTML(g, cols);
      html += '<h3>'+g.title+'</h3>';
      html += '<span class="cp-gname">'+ (cs.set.name||'') +'</span>';
      html += '<span class="cp-gnum">'+(cs.si+1)+'/'+g.sets.length+'</span>';
      html += '<div class="cp-gact">';
      html += '<button class="cp-star'+(starred?' on':'')+'" data-act="star" data-g="'+g.key+'" title="存入仓库">';
      html += '<span class="ic">'+(starred?'★':'☆')+'</span>';
      html += '<span class="lb">'+(starred?'已入库':'入库')+'</span></button>';
      html += '<button class="cp-copy" data-act="copy" data-g="'+g.key+'" title="一键复制这一套配色">复制全部</button>';
      html += '</div></div>';
      html += '<div class="cp-note">'+noteFor(g)+'</div>';
      if(g.key==='gradient') html += '<div class="cp-gradbar" style="background:linear-gradient(90deg,'+cols.join(',')+')"></div>';
      html += '<div class="cp-sws'+(g.key==='contrast' ? ' two' : (g.key==='gradient' ? ' seven' : ''))+'">';
      for(var ci=0; ci<cols.length; ci++){
        var hex = upHex(cols[ci]), sub = subOf(hex);
        html += '<div class="cp-sw" data-k="'+g.key+'-'+cs.si+'-'+ci+'">';
        html += '<div class="cp-chip" style="background:'+hex+';color:'+inkOn(hex)+'">';
        html += '<span class="cp-code">'+codeOf(hex)+'</span>';
        if(sub) html += '<span class="cp-code2">'+sub+'</span>';
        html += '</div>';
        html += '<button class="cp-tool cp-drop" data-act="drop" data-g="'+g.key+'" data-s="'+cs.si+'" data-c="'+ci+'" title="屏幕吸管取色"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></button>';
        html += '<button class="cp-tool cp-pick" data-act="pick" data-g="'+g.key+'" data-s="'+cs.si+'" data-c="'+ci+'" title="微调颜色"><i>✎</i></button>';
        html += '</div>';
      }
      html += '</div>';
      /* 色块下方：中间是六套循环翻页；「换一批」翻到第 6 套（最右那个点）才出现，
         「上一批」只要已经换过批（批次 > 0）就一直在，免得回不去第一批 */
      if(g.sets.length > 1){
        var atLast = (cs.si === g.sets.length - 1);
        var hasBatch = bidxOf(g.key) > 0;
        html += '<div class="cp-pager">';
        html += '<button class="cp-gbatch'+(hasBatch?'':' cp-hide')+'" data-act="gbprev" data-g="'+g.key+'"'
              + (hasBatch?'':' disabled') + ' title="这一组回到上一批配色">← 上一批</button>';
        html += '<div class="cp-pgmid">';
        html += '<button class="cp-pg" data-act="step" data-d="-1" data-g="'+g.key+'" title="上一套">‹</button>';
        html += '<div class="cp-dots">';
        for(var di=0; di<g.sets.length; di++){
          var dn = esc(String(g.sets[di].name || ('第'+(di+1)+'套')));
          html += '<button class="'+(di===cs.si?'on':'')+'" data-act="go" data-i="'+di+'" data-g="'+g.key+'" title="'+dn+'"></button>';
        }
        html += '</div>';
        html += '<button class="cp-pg" data-act="step" data-d="1" data-g="'+g.key+'" title="下一套">›</button>';
        html += '</div>';
        html += '<button class="cp-gbatch pri'+(atLast?'':' cp-hide')+'" data-act="gbnext" data-g="'+g.key
              + '" title="只给这一组换 6 套新配色">换一批 ⟳</button>';
        html += '</div>';
      }
      html += '</div>';
    }
    elGroups.innerHTML = html;
    histUI();
    document.getElementById('cpLibN').textContent = libAll().length;
  }

  /* ---------- 交互 ---------- */
  elGroups.addEventListener('click', function(e){
    var t = e.target;
    var btn = t.closest ? t.closest('[data-act]') : null;
    if(btn){
      var act = btn.getAttribute('data-act'), gk = btn.getAttribute('data-g');
      if(act === 'exitsearch'){ exitSearch(); return; }
      var g = groupOf(gk);
      if(!g) return;
      var cs = curSet(g);
      if(act==='pick'){
        openPicker(gk, cs.si, parseInt(btn.getAttribute('data-c'),10));
      } else if(act==='step'){
        var n = g.sets.length, d = parseInt(btn.getAttribute('data-d'),10) || 1;
        IDX[gk] = ((cs.si + d) % n + n) % n;      /* 循环：末尾继续就是头 */
        render();
      } else if(act==='go'){
        var to = parseInt(btn.getAttribute('data-i'),10);
        if(to >= 0 && to < g.sets.length){ IDX[gk] = to; render(); }
      } else if(act==='star'){
        toggleStar(g);
      } else if(act==='drop'){
        screenPick(g, cs.si, parseInt(btn.getAttribute('data-c'),10));
      } else if(act==='copy'){
        copyText(paletteText(curColors(g)), '已复制这一套 · ' + ENC_LABEL[ENC] + ' · ' + curColors(g).length + ' 色');
      } else if(act==='gbprev'){
        goGroupBatch(gk, -1);
      } else if(act==='gbnext'){
        goGroupBatch(gk, 1);
      }
      return;
    }
    /* 单击色块 = 单独复制该色值 */
    var sw = t.closest ? t.closest('.cp-sw') : null;
    if(!sw) return;
    var k = String(sw.getAttribute('data-k')||'').split('-');
    var gg = groupOf(k[0]);
    if(!gg) return;
    var hx = upHex(colorAt(gg, parseInt(k[1],10), parseInt(k[2],10)));
    copyText(codeFull(hx), '已复制 · ' + codeFull(hx));
  });

  /* ---------- 取色面板（页面内自绘，替代系统取色框——只有自绘才能把撤销/重做放进面板里） ---------- */
  var pkOvl = document.getElementById('cpPkOvl');
  var elSv = document.getElementById('cpSv'), elSvDot = document.getElementById('cpSvDot');
  var elHue = document.getElementById('cpHue'), elHueDot = document.getElementById('cpHueDot');
  var elPkPrev = document.getElementById('cpPkPrev'), elPkHex = document.getElementById('cpPkHex');
  var elPkUndo = document.getElementById('cpPkUndo'), elPkRedo = document.getElementById('cpPkRedo');
  var P = null;   /* {g, si, ci, h, s, v, from, to} */

  function rgb2hsv(r, g, b){
    r/=255; g/=255; b/=255;
    var mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn, h = 0;
    if(d){
      if(mx===r) h = ((g-b)/d) % 6;
      else if(mx===g) h = (b-r)/d + 2;
      else h = (r-g)/d + 4;
      h *= 60; if(h < 0) h += 360;
    }
    return [Math.round(h), Math.round(mx ? d/mx*100 : 0), Math.round(mx*100)];
  }
  function hsv2hex(h, s, v){
    s/=100; v/=100;
    var c = v*s, x = c*(1 - Math.abs((h/60) % 2 - 1)), m = v - c, rgb;
    if(h < 60) rgb = [c,x,0]; else if(h < 120) rgb = [x,c,0]; else if(h < 180) rgb = [0,c,x];
    else if(h < 240) rgb = [0,x,c]; else if(h < 300) rgb = [x,0,c]; else rgb = [c,0,x];
    var out = '#';
    for(var i=0;i<3;i++) out += ('0' + Math.round((rgb[i]+m)*255).toString(16)).slice(-2);
    return out.toUpperCase();
  }
  function clampPct(v){ return Math.max(0, Math.min(100, v)); }

  function syncPickUI(){
    elSv.style.background = hsv2hex(P.h, 100, 100);
    elSvDot.style.left = P.s + '%';
    elSvDot.style.top = (100 - P.v) + '%';
    elHueDot.style.left = (P.h / 360 * 100) + '%';
    var hx = hsv2hex(P.h, P.s, P.v);
    elPkPrev.style.background = hx;
    elPkHex.textContent = hx;
  }
  /* 撤销/重做改了面板正调的那个色 → 面板跟着走 */
  function syncPickToSwatch(){
    if(!P) return;
    var g = groupOf(P.g); if(!g) return;
    var hx = upHex(colorAt(g, P.si, P.ci));
    var c = h2r(hx), q = rgb2hsv(c[0], c[1], c[2]);
    P.h = q[0]; P.s = q[1]; P.v = q[2];
    P.from = hx; P.to = hx;
    syncPickUI();
  }
  function openPicker(gk, si, ci){
    var g = groupOf(gk); if(!g) return;
    P = {g:gk, si:si, ci:ci, from:upHex(colorAt(g, si, ci))};
    P.to = P.from;
    var c = h2r(P.from), q = rgb2hsv(c[0], c[1], c[2]);
    P.h = q[0]; P.s = q[1]; P.v = q[2];
    syncPickUI(); histUI();
    pkOvl.classList.add('on');
  }
  function closePicker(){
    if(!P) return;
    if(P.from !== P.to) pushHist({g:P.g, s:P.si, c:P.ci, from:P.from, to:P.to});
    P = null;
    pkOvl.classList.remove('on');
  }
  function applyPick(){
    var hx = hsv2hex(P.h, P.s, P.v);
    setOverride(groupOf(P.g), P.si, P.ci, hx);
    P.to = hx;
    patchSwatch(P.g, P.si, P.ci, hx);
  }
  function areaMove(e, isHue){
    if(!P) return;
    var el = isHue ? elHue : elSv;
    var r = el.getBoundingClientRect();
    if(!r.width || !r.height) return;
    if(isHue){
      P.h = Math.max(0, Math.min(359.9, (e.clientX - r.left) / r.width * 360));
    } else {
      P.s = clampPct((e.clientX - r.left) / r.width * 100);
      P.v = clampPct((1 - (e.clientY - r.top) / r.height) * 100);
    }
    applyPick(); syncPickUI();
  }
  function bindArea(el, isHue){
    var down = false;
    el.addEventListener('pointerdown', function(e){
      down = true;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      areaMove(e, isHue);
      e.preventDefault();
    });
    el.addEventListener('pointermove', function(e){ if(down) areaMove(e, isHue); });
    function up(){
      if(!down) return;
      down = false;
      if(P && P.from !== P.to){
        pushHist({g:P.g, s:P.si, c:P.ci, from:P.from, to:P.to});
        P.from = P.to;
      }
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }
  bindArea(elSv, false);
  bindArea(elHue, true);

  elPkUndo.addEventListener('click', function(){ doUndo(); });
  elPkRedo.addEventListener('click', function(){ doRedo(); });
  document.getElementById('cpPkDone').addEventListener('click', closePicker);
  pkOvl.addEventListener('click', function(e){ if(e.target === pkOvl) closePicker(); });
  document.addEventListener('keydown', function(e){
    if(!pkOvl.classList.contains('on')) return;
    if(e.key === 'Escape' || e.keyCode === 27) closePicker();
  });
  document.getElementById('cpPkDrop').addEventListener('click', function(){
    if(!window.EyeDropper){ toast('当前环境不支持屏幕吸管'); return; }
    try{
      new EyeDropper().open().then(function(res){
        if(!P) return;
        var hx = upHex(res.sRGBHex);
        var c = h2r(hx), q = rgb2hsv(c[0], c[1], c[2]);
        P.h = q[0]; P.s = q[1]; P.v = q[2];
        applyPick(); syncPickUI();
        pushHist({g:P.g, s:P.si, c:P.ci, from:P.from, to:P.to});
        P.from = P.to;
        toast('吸管取色 · ' + hx);
      }).catch(function(){});
    }catch(e){ toast('屏幕吸管不可用'); }
  });

  function patchSwatch(gk, si, ci, hex){
    var node = elGroups.querySelector('.cp-sw[data-k="'+gk+'-'+si+'-'+ci+'"]');
    if(!node){ render(); return; }
    var chip = node.querySelector('.cp-chip');
    chip.style.background = hex;
    chip.style.color = inkOn(hex);
    var c1 = node.querySelector('.cp-code');
    if(c1) c1.textContent = codeOf(hex);
    var sub = subOf(hex);
    var c2 = node.querySelector('.cp-code2');
    if(c2) c2.textContent = sub;
    else if(sub){
      c2 = document.createElement('span');
      c2.className = 'cp-code2';
      c2.textContent = sub;
      chip.appendChild(c2);
    }
    var group = node.closest('.cp-group');
    if(group){
      var g2 = groupOf(gk);
      if(g2){
        var dw = group.querySelector('.cp-dotwrap');
        if(dw) dw.outerHTML = dotWrapHTML(g2, curColors(g2));
      }
    }
    if(gk === 'gradient') syncGradBar();
    if(group){
      var g = groupOf(gk), star = group.querySelector('.cp-star');
      if(g && star){
        var on = isStarred(g);
        star.className = 'cp-star' + (on ? ' on' : '');
        var ic = star.querySelector('.ic'), lb = star.querySelector('.lb');
        if(ic) ic.textContent = on ? '★' : '☆';
        if(lb) lb.textContent = on ? '已入库' : '入库';
      }
    }
  }

  function syncGradBar(){
    var g = groupOf('gradient');
    if(!g) return;
    var bar = elGroups.querySelector('.cp-gradbar');
    if(bar) bar.style.background = 'linear-gradient(90deg,' + curColors(g).join(',') + ')';
  }

  function screenPick(g, si, ci){
    if(!window.EyeDropper){
      toast('当前环境不支持屏幕吸管，可直接点色块用系统取色盘');
      return;
    }
    try{
      var from = upHex(colorAt(g, si, ci));
      new EyeDropper().open().then(function(res){
        var hex = upHex(res.sRGBHex);
        setOverride(g, si, ci, hex);
        patchSwatch(g.key, si, ci, hex);
        if(from !== hex) pushHist({g:g.key, s:si, c:ci, from:from, to:hex});
        toast('吸管取色 · ' + hex);
      }).catch(function(){});
    }catch(e){
      toast('屏幕吸管不可用，可直接点色块用系统取色盘');
    }
  }

  function toggleStar(g){
    var cs = curSet(g), colors = curColors(g);
    var item = {name:cs.set.name, type:g.title, colors:colors, t:Date.now()};
    var arr = libLoad(), k = libKeyOf(item);
    var at = -1;
    for(var i=0;i<arr.length;i++){ if(libKeyOf(arr[i])===k){ at = i; break; } }
    if(at >= 0){ arr.splice(at,1); libSave(arr); toast('已移出仓库'); }
    else { arr.push(item); libSave(arr); toast('已存入仓库 · '+cs.set.name); }
    render(); renderLib(); popStar(g.key);
  }

  /* 入库那颗星的仪式感：慢一拍的回弹 */
  function popStar(gk){
    var star = elGroups.querySelector('.cp-star[data-g="'+gk+'"]');
    if(!star) return;
    star.classList.add('pop');
    setTimeout(function(){ star.classList.remove('pop'); }, 820);
  }

  /* ---------- 抽屉 ---------- */
  var drawer = document.getElementById('cpDrawer');
  document.getElementById('cpLibBtn').addEventListener('click', function(e){
    e.stopPropagation();

  document.getElementById('cpDrawerClose').addEventListener('click', function(){ drawer.classList.remove('on'); });
  /* 点仓库外面（抽屉与仓库按钮以外任意处）自动关闭 */
  document.addEventListener('click', function(e){
    if(!drawer.classList.contains('on')) return;

  function renderLib(){
    var all = libAll(), body = document.getElementById('cpDrawerBody');
    document.getElementById('cpLibN').textContent = all.length;
    if(!all.length){
      body.innerHTML = '<div class="cp-dempty">仓库还是空的。<br>看到喜欢的方案，点卡片右上角的 ☆ 存进来。</div>';

      h += '<div class="cp-libitem"><div class="nm"><span>'+ (it.name||'未命名') +'</span><span class="tp">'+ (it.type||'收藏') +'</span></div>';
      h += '<div class="cp-libsws" style="grid-template-columns:repeat('+Math.max(cols.length,1)+',1fr)">';
      for(var j=0;j<cols.length;j++){
        var hx = upHex(cols[j]);
        h += '<div class="cp-libsw" data-lib="one" data-i="'+i+'" data-c="'+j+'" style="background:'+hx+';color:'+inkOn(hx)+'" title="点一下复制该色值">';
        h += '<span>'+codeFull(hx)+'</span></div>';
      }
      h += '</div><div class="cp-libact">';
      h += '<button data-lib="pal" data-i="'+i+'">复制全部</button>';
      h += '<button class="del" data-lib="del" data-i="'+i+'">移出</button>';
      h += '</div></div>';
    }
    body.innerHTML = h;
  }

  document.getElementById('cpDrawerBody').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-lib]') : null;
    if(!b) return;
    var i = parseInt(b.getAttribute('data-i'),10);
    var all = libAll(), item = all[i];
    if(!item) return;
    var act = b.getAttribute('data-lib');
    if(act === 'pal'){
      copyText(paletteText(item.colors || []), '已复制「' + (item.name||'方案') + '」· ' + ENC_LABEL[ENC]);
    } else if(act === 'one'){
      var ci = parseInt(b.getAttribute('data-c'),10);
      var hx = upHex((item.colors||[])[ci]);
      copyText(codeFull(hx), '已复制 · ' + codeFull(hx));
    } else if(act === 'del'){
      var k = libKeyOf(item), arr = libLoad(), at = -1;
      for(var x=0;x<arr.length;x++){ if(libKeyOf(arr[x])===k){ at = x; break; } }
      if(at >= 0){ arr.splice(at,1); libSave(arr); }
      INJECTED = INJECTED.filter(function(t){ return libKeyOf(t)!==k; });
      renderLib(); render(); toast('已移出');

  document.getElementById('cpCopyLib').addEventListener('click', function(){
    var all = libLoad();
    if(!all.length){
      all = INJECTED;
      if(!all.length){ toast('仓库是空的，先存几个方案吧'); return; }
    }
    var txt = JSON.stringify(all, null, 1);
    copyText(txt, '已复制 · 发给我就能写进永久仓库');
  });
  function fallback(txt, done){
    try{
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); done();
    }catch(e){ toast('复制失败，请手动截图给我'); }
  }

  /* ---------- 编码切换（滑块指示器） ---------- */
  var segEl = document.getElementById('cpSeg');
  var indEl = segEl.querySelector('.cp-ind');
  function moveInd(){
    var btn = segEl.querySelector('button[data-enc="' + ENC + '"]');
    if(!btn || !indEl) return;
    indEl.style.width = btn.offsetWidth + 'px';
    indEl.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
  }
  segEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-enc]') : null;
    if(!b) return;
    var kids = segEl.querySelectorAll('button');
    for(var i=0;i<kids.length;i++) kids[i].classList.remove('on');
    b.classList.add('on');
    ENC = b.getAttribute('data-enc');
    moveInd();
    render();
    renderLib();
  });
  window.addEventListener('resize', function(){ moveInd(); moveThInd(); measureSeg(); headFloat(); });

  /* ---------- 外观：日间（米白）/ 夜间（深灰） ---------- */
  var THEME_KEY = 'cp_theme_v1';
  var elTheme = document.getElementById('cpTheme'), thInd = elTheme.querySelector('.cp-th-ind');
  function moveThInd(){
    var b = elTheme.querySelector('button.on');
    if(!b || !thInd) return;
    thInd.style.width = b.offsetWidth + 'px';
    thInd.style.transform = 'translateX(' + b.offsetLeft + 'px)';
  }
  function setTheme(th){
    if(th === 'light'){ root.classList.add('th-light'); }
    else { root.classList.remove('th-light'); }
    var bs = elTheme.querySelectorAll('button');
    for(var i=0;i<bs.length;i++){
      if(bs[i].getAttribute('data-th') === th) bs[i].classList.add('on');
      else bs[i].classList.remove('on');
    }
    /* 页面底色与组件底色取一致，避免出现"浮在页面上的模块"观感 */
    try{ document.body.style.background = (th === 'light' ? '#F7F3E8' : '#0E1118'); }catch(e){}
    try{ localStorage.setItem(THEME_KEY, th); }catch(e){}
    moveInd(); moveThInd();
  }
  elTheme.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-th]') : null;
    if(!b) return;
    setTheme(b.getAttribute('data-th'));
  });

  /* ---------- toast ---------- */
  var toastEl = document.getElementById('cpToast'), toastTx = document.getElementById('cpToastTx'), tTimer = null;
  /* 全部提示都固定在屏幕下方正中显示（不跟鼠标、不跟页面滚动），只做淡入；
     缺词这类需要读明白的提示传更长的 ms，复制类默认 1 秒 */
  function toast(msg, ms){
    toastTx.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(tTimer);
    tTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, ms || 1000);
  }

  /* ---------- 悬停提示跟随鼠标 ---------- */
  var elTip = document.getElementById('cpTip');
  elGroups.addEventListener('mousemove', function(e){
    var sw = e.target.closest ? e.target.closest('.cp-sw') : null;
    var tool = e.target.closest ? e.target.closest('.cp-tool') : null;
    if(sw && !tool){
      var pr = root.getBoundingClientRect();
      elTip.style.left = (e.clientX - pr.left + 14) + 'px';
      elTip.style.top = (e.clientY - pr.top + 20) + 'px';
      elTip.classList.add('on');
    } else {
      elTip.classList.remove('on');
    }
  });
  elGroups.addEventListener('mouseleave', function(){ elTip.classList.remove('on'); });

  /* ---------- 联想输入面板：磨砂玻璃 + 分区标签流 ---------- */
  var panelEl = document.getElementById('cpPanel');
  var searchInput = document.getElementById('cpSearch');
  /* 占位符轮换（主人钦定文案，改动先送审） */
  var PHS = ['输入你心中的想法，赋予它色彩', '太抽象我会听不懂哦'];
  var phIdx = 0;
  setInterval(function(){
    phIdx = (phIdx + 1) % PHS.length;
    if(!searchInput.value && document.activeElement !== searchInput){
      searchInput.placeholder = PHS[phIdx];
    }
  }, 24000);
  function renderPanel(missQ){
    var h = '<div class="cp-phead"><span>点一个标签直接联想，或在上面输入你想要的感觉</span>'
          + '<button id="cpPanelClose" title="收起面板">✕ 收起</button></div>';
    if(missQ){
      h += '<div class="cp-miss">「'+esc(missQ)+'」还没进词典，已经替你记下来了。'
         + '<button id="cpMissCopy">复制缺词清单</button>'
         + '<button id="cpMissGH">去 GitHub 提交 ↗</button></div>';
    }
    var cat = null, open = false;
    for(var i=0;i<DICT.length;i++){
      var en = DICT[i];
      if(en.cat !== cat){
        if(open) h += '</div></div>';
        h += '<div class="cp-cat"><div class="cp-cat-h"><span>'+esc(en.cat)+'</span></div><div class="cp-tags">';
        cat = en.cat; open = true;
      }
      h += '<button class="cp-tag" data-w="'+esc(en.w)+'">'+esc(en.w)+'</button>';
    }
    if(open) h += '</div></div>';
    panelEl.innerHTML = h;
  }
  function openPanel(){ renderPanel(); root.classList.add('searching'); }
  function closePanel(){ root.classList.remove('searching'); }
  panelEl.addEventListener('click', function(e){
    if(!e.target || !e.target.closest) return;
    var t = e.target;
    if(t.id === 'cpPanelClose'){ closePanel(); return; }
    if(t.id === 'cpMissCopy'){
      var m = missAll();
      copyText(m.join('、'), '已复制 '+m.length+' 个缺词，粘贴进 GitHub Issue 或发给我们都行');
      return;
    }
    if(t.id === 'cpMissGH'){
      var u = ghMissUrl();
      if(u){ try{ window.open(u, '_blank'); }catch(e){ location.href = u; } }
      else{ copyText('', '暂时没有缺词记录，先搜几个词典没有的词再来'); }
      return;
    }
    var tag = t.closest('.cp-tag');
    if(tag){ doSearch(tag.getAttribute('data-w')); }
  });
  searchInput.addEventListener('focus', function(){ openPanel(); });
  /* 点搜索框图标或两侧留白也能聚焦输入框（真实浏览器里点容器不会自动聚焦 input） */
  document.getElementById('cpSbox').addEventListener('click', function(){ searchInput.focus(); });
  searchInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ doSearch(searchInput.value); }
    else if(e.key === 'Escape'){ closePanel(); searchInput.blur(); }
  });

  /* ---------- 标语轮换：每一句都在提醒「可以现场搜」 ---------- */
  var SLOGANS = [
    '在这里，打造自己心仪的专属配色方案。',
    '想要什么感觉？搜一下试试，比如「初雪」或「中国年」。',
    '物品、情绪、风格、节日，任何词都可以输，配色替你联想。',
    '词典之外也不怕，缺的词会被记下来，下个版本补上。'
  ];
  var sloganIdx = 0;
  elSub.textContent = SLOGANS[0];
  setInterval(function(){
    sloganIdx = (sloganIdx + 1) % SLOGANS.length;
    elSub.classList.add('fade');
    setTimeout(function(){
      elSub.textContent = SLOGANS[sloganIdx];
      elSub.classList.remove('fade');
    }, 280);
  }, 24000);

  /* ---------- 格式框吸顶：滚动到它原本的位置后钉住，阴影随之显现 ---------- */
  var elSeg = document.getElementById('cpSeg');
  function docTopOf(el){ var t = 0; while(el){ t += el.offsetTop; el = el.offsetParent; } return t; }
  var segTop = 0;
  function measureSeg(){ if(elSeg) segTop = docTopOf(elSeg); }
  function headFloat(){
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if(elSeg) elSeg.classList.toggle('float', y >= segTop - 2);
  }
  measureSeg();
  window.addEventListener('scroll', headFloat, {passive:true});
  headFloat();

  render();
  renderLib();
  histUI();
  var initTh = 'dark';
  try{ initTh = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}
  setTheme(initTh);
  setTimeout(function(){ moveInd(); moveThInd(); }, 120);
  if(document.fonts && document.fonts.ready && document.fonts.ready.then){
    try{ document.fonts.ready.then(function(){ setTimeout(function(){ moveInd(); moveThInd(); }, 0); }); }catch(e){}
  }
})();
</script>
</div>

</body>
</html>
